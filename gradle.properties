# Environment. Neo version must agree with the Minecraft version.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.235
loader_version_range=[1,)

# Mod properties
mod_id=grandline
mod_name=One Piece: Grand Line
mod_license=All Rights Reserved
mod_version=0.5.0
mod_group_id=com.nerodev.grandline
